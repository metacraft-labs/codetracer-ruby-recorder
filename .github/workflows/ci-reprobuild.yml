name: CI (reprobuild)

# Additive side-by-side CI run that re-plays the project's
# deterministic dev env through reprobuild instead of `nix develop` or
# `env.ps1`. Runs alongside the existing `ci.yml` (`nix`) and any
# `windows-build.yml` (`windows-diy`) entries so regressions in either
# of the older paths still gate merges — see
# `codetracer-specs/Repo-Requirements.md` §2.9 and
# `metacraft-dev-guidelines/policies/ci-shared-dev-env.md` §4 for the
# rollout shape.
#
# The `setup-dev-env` composite action accepts `env-flavor: reprobuild`
# (target state per the policy). When the action's reprobuild branch
# lands, this workflow exercises it end-to-end on every supported
# host without any other repo-side change.

on:
  push:
    branches: [main, dev, stable]
  pull_request:
    branches: [main, dev, stable]

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reprobuild:
    name: ${{ matrix.os }}-${{ matrix.arch }} — repro build/test
    strategy:
      fail-fast: false
      matrix:
        # `tool-provisioning-overrides` is the per-tool provisioning override
        # set the two repro steps below run under
        # (REPRO_TOOL_PROVISIONING_OVERRIDES, `<package>=<mode>,...`).
        # From reprobuild v0.2.31 on, `--tool-provisioning=path` takes every
        # tool from PATH and nothing else: a tool PATH lacks fails resolution
        # instead of falling back to an archive or Nix. The flake dev shell
        # supplies most of `repro.nim`'s `uses:` on Linux and macOS, but not
        # these three:
        #
        # - `ruby-recorder-sdk`, this repo's pinned Ruby SDK
        #   (`ruby_sdk_tools.nim`). It has only a Nix realization, and no
        #   executable on PATH carries its identity.
        # - `libclang` and `zstd-dev`, which select headers and libraries.
        #   Path mode can take neither from PATH.
        #
        # Each is realized by its package's Nix arm, which is what v0.2.29's
        # path-mode fall-through did implicitly. On Windows `zstd-dev` comes
        # from its MSYS2 archive arm. `ruby-recorder-sdk` has no Windows
        # realization yet, so the Windows legs still stop at it.
        #
        # The overrides are set here and not in a committed
        # `repro-workspace.toml`: that file would make this repository a
        # workspace root, and its override table cannot differ per platform.
        include:
          - os: linux
            arch: x64
            runner: [self-hosted, linux, x64]
            tool-provisioning-overrides: "ruby-recorder-sdk=nix,libclang=nix,zstd-dev=nix"
          - os: linux
            arch: arm64
            runner: [self-hosted, linux, arm64]
            tool-provisioning-overrides: "ruby-recorder-sdk=nix,libclang=nix,zstd-dev=nix"
          - os: macos
            arch: arm64
            runner: [self-hosted, macos, arm64]
            tool-provisioning-overrides: "ruby-recorder-sdk=nix,libclang=nix,zstd-dev=nix"
          - os: windows
            arch: x64
            runner: [self-hosted, windows, x64]
            tool-provisioning-overrides: "zstd-dev=tarball"
          - os: windows
            arch: arm64
            runner: [self-hosted, windows, arm64]
            tool-provisioning-overrides: "zstd-dev=tarball"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Mint a GitHub App installation token via the CI Token Provider
      # app so the reprobuild flake/sibling steps can clone private
      # metacraft-labs repos (codetracer-native-recorder, runquota,
      # repo-workspaces, etc.) and so the workspace-lock checkout below
      # can read metacraft-manifests.  GitHub free plan restricts
      # org-level secrets with visibility ALL from being readable in
      # private repos, so we mint per-run tokens from the app secrets
      # stored at repo level (CI_TOKEN_PROVIDER_APP_ID +
      # CI_TOKEN_PROVIDER_PRIVATE_KEY).
      - name: Mint installation token for cross-repo sibling clones
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Setup dev env (reprobuild flavor)
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: reprobuild
          # reprobuild v0.2.33 (688303d4b1) on every leg. Unix legs build that
          # commit from source; Windows legs install the v0.2.33 release
          # archive (arm64 runs the x86_64 one under emulation), because
          # reprobuild's Windows source bootstrap has no arm64 toolchain.
          repro-from-source: ${{ runner.os != 'Windows' && 'true' || 'false' }}
          repro-version: v0.2.33
          repro-build-pin: "688303d4b132c42deeaa7bcca77b008e3f0f8b8c"
          gh-token: ${{ steps.ci_token.outputs.token }}
          # A job-scoped broker re-mints the Nix GitHub credential while
          # setup and the build run, so it outlives the token's one hour.
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          app-private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          # Trust and populate the org Attic cache (repo variables and the
          # ATTIC_TOKEN secret are already provisioned).
          substituters: ${{ vars.SUBSTITUTERS }}
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          attic-endpoint: ${{ vars.ATTIC_ENDPOINT }}

      - name: repro build
        # Builds the conventional `build` collection declared in
        # `repro.nim`. Verifies the primary shipping artefact (the
        # recorder binary or extension) materialises through the
        # reprobuild engine identically to `just build`.
        # reprobuild v0.2.23 refuses `uses:` declarations without an explicit
        # provisioning mode ("refusing implicit PATH fallback"); this recipe
        # resolves its tools from the prepared environment's PATH.
        env:
          REPRO_TOOL_PROVISIONING_OVERRIDES: ${{ matrix.tool-provisioning-overrides }}
        run: dev-exec repro build --tool-provisioning=path

      - name: repro test
        # Materialises the complete `test` collection declared in
        # `repro.nim` (ABI check, gem installation, the full Ruby suite, the
        # CLI convention guard, and both Cargo test edges).
        #
        # Not certifying: no `[certificate_policy]` is enacted in `repro.lock`,
        # so nothing requires a certificate here.
        env:
          REPRO_TOOL_PROVISIONING_OVERRIDES: ${{ matrix.tool-provisioning-overrides }}
        run: dev-exec repro test --no-certify --tool-provisioning=path

      - name: just build (cross-check)
        # Re-runs the legacy `just build` path inside the same env so
        # we catch silent divergences between `repro build` outputs
        # and what the dev shell + Justfile produce today.
        run: dev-exec just build

      - name: just test (cross-check)
        run: dev-exec just test

      # Diagnostics on failure. Three things below are load-bearing:
      #
      # 1. `include-hidden-files: true`. actions/upload-artifact@v4 defaults this
      #    input to false, and @actions/glob then skips any entry it traverses whose
      #    own basename starts with "." (internal-globber.ts:
      #    `if (options.excludeHiddenFiles && path.basename(item.path).match(/^\./))
      #    continue`). The old `path: .repro/` made `.repro` itself the search root,
      #    so it was skipped outright and this step logged
      #      "No files were found with the provided path: target/ .repro/"
      #    which `if-no-files-found: ignore` then swallowed. Net effect: the build
      #    engine's per-action stdio captures -- `<outDir>/build-engine-cache/
      #    actions/<actionId>.stderr.log`, see repro_build_engine.nim -- have never
      #    been uploaded from any leg of this workflow, on any platform.
      # 2. Narrow paths. A whole `.repro/` tree measures ~1.1 GiB (dominated by
      #    build-engine-cache/monitor-depfiles and dependency-evidence); the failure
      #    report plus the per-action logs are ~600 KiB. `target/` was dropped: it is
      #    a build-output tree rather than a log tree, it matches nothing in the Nim
      #    repos, and where it does match it would permanently mask the warning below.
      # 3. `if-no-files-found: warn` (the action's own default). This step only runs
      #    on failure, so a warning costs nothing -- and it is exactly what would have
      #    surfaced (1) years ago instead of hiding it behind a green step.
      #
      # Context, 2026-09: no leg of this workflow is green on ANY platform. Census of
      # the job records: linux-x64 77 failure / 19 cancelled / 0 success, linux-arm64
      # 77/19/0, macos-arm64 75/25/0, windows-x64 61/35/0. The only two successes on
      # record are from 2026-07-06, under the pre-rename job names. The arm64 leg
      # fails earlier than x64, and x64 fails for an unrelated project-level reason
      # (`cannot open file: results`, codetracer_ct_print.nim(24, 8)). These
      # artifacts are the only way to find out why any of it actually fails.
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .repro/build/*/build-failure-report.json
            .repro/build/*/build-engine-cache/actions/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: warn

      - name: Mirror test logs to S3 (non-blocking)
        if: failure()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: target/
          prefix: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}/${{ github.run_id }}/target
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}

      - name: Mirror reprobuild logs to S3 (non-blocking)
        if: failure()
        continue-on-error: true
        uses: metacraft-labs/metacraft-github-actions/mirror-artifacts-s3@dev
        with:
          path: .repro/
          prefix: reprobuild-logs-${{ matrix.os }}-${{ matrix.arch }}/${{ github.run_id }}/repro
          endpoint: ${{ vars.MCL_S3_ARTIFACTS_ENDPOINT }}
          bucket: ${{ vars.MCL_S3_ARTIFACTS_BUCKET }}
          region: ${{ vars.MCL_S3_ARTIFACTS_REGION }}
          access-key-id: ${{ secrets.MCL_S3_ARTIFACTS_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MCL_S3_ARTIFACTS_SECRET_ACCESS_KEY }}
